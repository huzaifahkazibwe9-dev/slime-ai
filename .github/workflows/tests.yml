name: Slime AI tests

on:
  push:
    branches: [main]
  # Run validation for PRs targeting main or any dependent feature branch.
  pull_request:
  schedule:
    # Daily at 03:17 UTC; GitHub may delay scheduled starts.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slime-ai-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Load private Level 39 evidence (optional)
        env:
          LEVEL39_EVIDENCE_ZIP_B64: ${{ secrets.LEVEL39_EVIDENCE_ZIP_B64 }}
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import os
          import zipfile
          from pathlib import Path

          encoded = os.environ.get("LEVEL39_EVIDENCE_ZIP_B64", "")
          if not encoded:
              print("Private evidence secret not configured; evidence-dependent tests will remain skipped.")
              raise SystemExit(0)

          try:
              archive_bytes = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"Private evidence secret is not valid base64: {exc}")

          expected = {
              "vision_level39.json",
              "shooter_detection.json",
              "color_matches.json",
              "conveyor_calibration.json",
              "conveyor_visual_observations.json",
              "conveyor_consistency_report.json",
              "conveyor_timeline.json",
          }

          try:
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  names = set(archive.namelist())
                  if names != expected:
                      raise SystemExit(
                          "Private evidence archive must contain exactly the seven approved JSON files."
                      )
                  files = {name: archive.read(name) for name in expected}
          except zipfile.BadZipFile as exc:
              raise SystemExit(f"Private evidence secret is not a valid ZIP archive: {exc}")

          for name, payload in files.items():
              json.loads(payload)
              target = Path("data") / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)

          print("Loaded and JSON-validated all seven private Level 39 evidence files.")
          PY
      - name: Validate Termux build script syntax
        run: bash -n build_pipeline.sh deploy_termux.sh
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -v
